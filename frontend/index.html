<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MuBWeM — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Archivo for headings, Inter for body, JetBrains Mono for figures.
       Five faces total - the minimum that keeps the hierarchy intact. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%2316a34a'/></svg>">
</head>
<body>
  <div class="shell">
    <nav id="sidenav" class="sidenav" aria-label="Main"></nav>

    <div class="shell-main">
      <header class="topbar">
        <div class="topbar-inner">
          <div>
            <h1>Dashboard</h1>
            <p class="tagline">Multi-Brand Website Monitor</p>
          </div>
          <div class="meta">
            <div class="meta-status">
              <div id="overall" class="overall" aria-live="polite">Loading…</div>
              <div class="updated">Updated <span id="updated">—</span></div>
            </div>
            <span class="meta-divider" aria-hidden="true"></span>
            <div class="session">
              <span id="signed-in-as"></span>
              <a href="#" id="logout" class="logout" hidden>Log out</a>
            </div>
          </div>
        </div>
      </header>

      <main>
        <div id="error" class="error" hidden></div>
        <div id="notice" class="notice" hidden></div>

        <!-- Populated by dashboard.js: search, status, brand and density.
             All client-side over the payload already fetched. -->
        <section id="toolbar" class="toolbar" aria-label="Filter monitors"></section>

        <!-- Summary moves into a right-hand rail so the monitor grid gets the
             width. Below the breakpoint in style.css the rail stacks above the
             grid instead of being squeezed into a column too narrow to hold a
             stat row. -->
        <div class="dash-layout">
          <div class="dash-main">
            <p id="result-count" class="result-count" hidden></p>

            <!-- Filled by dashboard.js: what the three bar colours mean. -->
            <div id="bucket-legend"></div>

            <!-- No aria-live here: render() replaces every child on each 20s
                 poll, so a live region would re-announce the whole grid.
                 #overall above carries the one-line roll-up instead. -->
            <section id="cards" class="cards"></section>
            <p id="empty" class="empty" hidden>
              No sites are being monitored yet. Add one from
              <a href="/sites">Monitors</a>, or seed the table with
              <code>scripts/seed_sites.py</code>.
            </p>
          </div>

          <aside id="summary" class="summary-side" aria-label="Summary"></aside>
        </div>
      </main>

      <footer>
        <span>Checks run every minute from ap-southeast-2 · Dashboard refreshes every 20s</span>
      </footer>
    </div>
  </div>

  <!-- Generated at deploy time by the CDK stack; sets the API URLs and the
       Cognito domain, client id and redirect URIs. -->
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="nav.js"></script>
  <script src="shell.js"></script>
  <script src="dashboard.js"></script>
  <script src="app.js"></script>
</body>
</html>
