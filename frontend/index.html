<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MuBWeM — Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%2316a34a'/></svg>">
</head>
<body>
  <div class="shell">
    <nav id="sidenav" class="sidenav" aria-label="Main"></nav>

    <div class="shell-main">
      <header class="topbar">
        <div class="topbar-inner">
          <div>
            <h1>Dashboard</h1>
            <p class="tagline">Multi-Brand Website Monitor</p>
          </div>
          <div class="meta">
            <div id="overall" class="overall">Loading…</div>
            <div class="updated">Updated <span id="updated">—</span></div>
            <div class="session">
              <span id="signed-in-as"></span>
              <a href="#" id="logout" class="logout" hidden>Log out</a>
            </div>
          </div>
        </div>
      </header>

      <main>
        <div id="error" class="error" hidden></div>
        <div id="notice" class="notice" hidden></div>

        <section id="summary" class="summary-grid" aria-label="Summary"></section>

        <section id="cards" class="cards" aria-live="polite"></section>
        <p id="empty" class="empty" hidden>
          No sites are being monitored yet. Add one from
          <a href="sites.html">Monitors</a>, or seed the table with
          <code>scripts/seed_sites.py</code>.
        </p>
      </main>

      <footer>
        <span>Checks run every minute from ap-southeast-2 · Dashboard refreshes every 20s</span>
      </footer>
    </div>
  </div>

  <!-- Generated at deploy time by the CDK stack; sets the API URLs and the
       Cognito domain, client id and redirect URIs. -->
  <script src="config.js"></script>
  <script src="auth.js"></script>
  <script src="nav.js"></script>
  <script src="shell.js"></script>
  <script src="dashboard.js"></script>
  <script src="app.js"></script>
</body>
</html>
