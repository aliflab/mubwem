<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MuBWeM — Monitor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Archivo for headings, Inter for body, JetBrains Mono for figures.
       Five faces total - the minimum that keeps the hierarchy intact. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='6' fill='%2316a34a'/></svg>">
</head>
<body>
  <div class="shell">
    <nav id="sidenav" class="sidenav" aria-label="Main"></nav>

    <div class="shell-main">
      <header class="topbar">
        <div class="topbar-inner">
          <div>
            <a href="/" class="crumb">← Dashboard</a>
            <h1 id="site-name">Monitor</h1>
            <p class="tagline" id="site-brand"></p>
          </div>
          <div class="meta">
            <div class="meta-status">
              <div id="overall" class="overall">Loading…</div>
              <div class="updated">Updated <span id="updated">—</span></div>
            </div>
            <span class="meta-divider" aria-hidden="true"></span>
            <div class="session">
              <span id="signed-in-as"></span>
              <a href="#" id="logout" class="logout" hidden>Log out</a>
            </div>
          </div>
        </div>
      </header>

      <main>
        <div id="error" class="error" hidden></div>
        <div id="notice" class="notice" hidden></div>

        <section class="panel" id="overview" hidden>
          <div class="detail-head">
            <div class="detail-id">
              <span id="site-badge" class="badge">—</span>
              <a id="site-url" class="card-url" target="_blank" rel="noopener noreferrer"></a>
            </div>
            <!-- Rendered only for Admins and Editors — see monitor.js. A
                 Viewer gets no button at all, not a disabled one. -->
            <button type="button" id="edit-toggle" class="primary" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
              Edit monitor
            </button>
          </div>

          <p class="section-label">Last 24 hours</p>
          <div id="hourbar-host"></div>
          <div id="hourbar-foot"></div>
          <dl class="stats" id="detail-stats"></dl>
        </section>

        <!-- Injected by monitor.js only when the caller may actually submit it. -->
        <section class="panel" id="edit-panel" hidden></section>

        <section class="panel" id="chart-panel" hidden>
          <h2>Response time — last 24 hours</h2>
          <p class="panel-hint" id="chart-hint"></p>
          <div class="chart-wrap"><canvas id="response-chart"></canvas></div>
        </section>

        <section class="panel" id="incidents-panel" hidden>
          <h2>Incidents</h2>
          <p class="panel-hint">Up to the 50 most recent incidents for this monitor.</p>
          <div id="incidents-host"></div>
        </section>
      </main>

      <footer>
        <span>Response times are measured from ap-southeast-2.</span>
      </footer>
    </div>
  </div>

  <script src="config.js"></script>
  <!-- Chart.js, pinned. UMD build, so it defines a global `Chart` with no
       bundler and no build step — the same way everything else here works. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="auth.js"></script>
  <script src="nav.js"></script>
  <script src="shell.js"></script>
  <script src="dashboard.js"></script>
  <script src="monitor.js"></script>
</body>
</html>
